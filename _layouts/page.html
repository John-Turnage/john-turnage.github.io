---
layout: default
---
<div class="page{% if page.page_class %} {{ page.page_class | escape }}{% endif %}">
  <header class="page-header">
    {%- if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  {{ content }}
</div>
