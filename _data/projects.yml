selected:
  - id: owls
    title: Operator learning with optimal sampling
    meta: Operator learning · Approximation theory
    body: |-
      Learning an operator from finitely many input-output pairs requires choosing both an approximation
      space and a way to sample the inputs. We study these choices together through weighted least squares
      in a Bochner $L^2$ space, where the input measure determines how approximation error is measured. An
      operator-level Christoffel function connects the approximation space to sampling measures and weights
      that make recovery stable.

      We construct linear and polynomial operator spaces, establish density under assumptions on the input
      measure, and describe how to sample from the associated Christoffel measures. Our finite-sample bounds
      separate best-approximation error from the error introduced by fitting from data. For suitable product
      spaces with full-field observations, the empirical Gram matrix reduces to repeated scalar blocks, so
      the number of samples sufficient for stability is independent of the output dimension.
    links:
      - label: Preprint
        url: https://arxiv.org/abs/2512.11168
      - label: Code
        url: https://github.com/John-Turnage/OWLS_OpLearn
    with: Matthew Lowery, John D. Jakeman, Zachary Morrow, Akil Narayan, and Varun Shankar
    figures:
      - src: /assets/img/research/owls-schematic.png
        alt: Schematic of the least-squares problem relating sampled inputs, noisy outputs, and the approximation space of operators.
        caption: >-
          Inputs are sampled from a measure adapted to the operator space $V$. The diagram distinguishes
          the best-approximation error in $V$ from the error introduced by fitting from finite data.
      # - src: /assets/img/research/owls-poisson.png
      #   alt: "Four panels: a random forcing, the true Poisson solution, the learned approximation, and their pointwise error."
      #   caption: >-
      #     Poisson equation on a median-error test input: forcing, true and learned solutions, and their
      #     pointwise difference, which stays below $10^{-5}$.
      # - src: /assets/img/research/owls-burgers.png
      #   alt: Three panels comparing true and approximate Burgers solutions, and a histogram of test errors.
      #   caption: >-
      #     Viscous Burgers' equation: true and learned solutions for the worst, median, and best test
      #     inputs, and the error distribution over 1000 tests.
      # - src: /assets/img/research/owls-navier-stokes.png
      #   alt: True vorticity, approximate vorticity, and their difference for a Navier–Stokes test sample.
      #   caption: >-
