  - id: residual
    title: Uncertainty quantification for operator learning
    meta: Uncertainty quantification · Gaussian measures
    body: |-
      A finite-dimensional operator approximation leaves a residual that the fitted coefficients do not
      describe. We study how additional observations can inform this residual through a Gaussian prior on
      the orthogonal complement of the approximation space. Defining the observation model requires care:
      point evaluation is not generally defined in a Bochner $L^2$ space. We establish conditions under which
      the prior assigns full measure to a Banach space where evaluation is continuous, and use Cameron–Martin
      theory to define the likelihood for noisy full-field observations.

      The residual data are formed by subtracting the computed least-squares fit, so they also contain
      first-stage estimation error. We analyze how this error propagates through Gaussian conditioning and
      obtain finite-sample bounds on the posterior expected squared error of the complete approximation.
      Under compatible regularity assumptions, these bounds identify when the accuracy rate available from
      ideal residual observations is preserved.
    status: In preparation
    with: John D. Jakeman and Akil Narayan
    figures:
      - src: /assets/img/research/residual-two-stage.png
        alt: Schematic of the two-stage approximation, from sampled inputs through the approximation space to predicted outputs.
        caption: >-
          The two stages use independent input samples, shown as filled and open points. The residual
          correction lies in $V^\perp$, so the first-stage error within $V$ remains. At right: the
          first-stage prediction (dashed), posterior mean (solid), and posterior draws (grey) at a fixed input.
      # - src: /assets/img/research/residual-function-spaces.png
      #   alt: Diagram of the function spaces and maps used for residual inference.
      #   caption: >-
      #     The prior is placed on continuous operators, where evaluation at an input $f$ is defined; it is
      #     not defined on general $L^2$ classes.

  - id: quadrature
    title: Constructive positive quadrature
    meta: Quadrature · Probability
    body: |-
      Integrating a weighted least-squares approximation gives a quadrature rule exact on the approximation
      space. Even when the fit is well conditioned, however, the resulting weights need not be positive or
      yield a stable rule. We study these questions through the alignment between evaluation representers
      and the target functional, using probabilistic estimates to control how the scaled weights concentrate
      near their limiting values.

      The analysis accommodates unbounded Christoffel functions and limiting weights that approach zero.
      Under suitable sampling and positivity assumptions, we obtain positive exact rules that can be reduced
      to at most $N$ nodes for an $N$-dimensional real approximation space, giving a constructive generalized
      Tchakaloff result. Additional tail assumptions provide weighted stability bounds for the rule before
      this reduction.
    links:
      - label: Preprint
        url: https://arxiv.org/abs/2609.09506
      - label: Code
        url: https://github.com/fbelik/ConstructiveTchakaloffRandomizedLeastSquares
    with: Filip Bělík and Akil Narayan
    figures:
      - src: /assets/img/research/quadrature-induced-rule.png
        alt: Quadrature weights from induced sampling clustering around their limiting curve, with the pruned positive rule marked in red.
        caption: >-
          A positive rule with 500 nodes is reduced to ten nodes while preserving exactness on the
          approximation space. For comparison, the original weights (blue) are multiplied by 500 and the
          reduced weights (red) by ten. Green shows the limiting scaled weights of the original rule.
      # - src: /assets/img/research/quadrature-densities.png
      #   alt: Sampling densities compared with the standard Gaussian density.
      #   caption: >-
      #     Sampling densities for $N = 5$: the standard Gaussian, the induced density, which concentrates
      #     samples near the basis singularities, and two mixtures.
      # - src: /assets/img/research/quadrature-basis.png
      #   alt: An orthonormal basis plotted in grey with a Riesz representer in red.
      #   caption: >-
      #     The test problem: the basis is singular at $x = -1, 0, 1$, so the Christoffel function is
      #     unbounded, and the representer of the integration functional (red) vanishes at $x = \pm\tfrac12$.

related:
  - id: kno
    title: Kernel neural operators
    body: >-
      Kernel neural operators approximate maps between function spaces through compositions of kernel
      integral operators. We develop an architecture in which the kernel and quadrature rule can be chosen
      independently, allowing expressive nonstationary, anisotropic kernels and integration rules adapted
      to irregular domains. We establish universal approximation results for both the continuous and
      discretized architectures. On the benchmarks studied, the method achieves accuracy comparable to
      Fourier and transformer neural operators, typically with an order of magnitude fewer trainable
      parameters.
    links:
      - label: TMLR
        url: https://openreview.net/forum?id=Q0C4jYZQ7x
      - label: arXiv
        url: https://arxiv.org/abs/2407.00809
      - label: Code
        url: https://github.com/matthew-lowery/kernel_neural_operator
    with: Matthew Lowery (lead author), Zachary Morrow, John D. Jakeman, Akil Narayan, Shandian Zhe, and Varun Shankar

  - id: generative
    title: Direct inference for quantities of interest
    body: >-
      In many inverse problems, the goal is to infer a low-dimensional quantity of interest from
      observations, while the unknown model parameters are high dimensional. We compare learning the
      conditional distribution of the quantity of interest directly with learning the parameter posterior
      and then pushing it forward. Using a linear–Gaussian benchmark, we examine accuracy and computational
      cost across several generative model classes. Direct learning reduces model size and measured training
      cost while achieving broadly comparable accuracy.
    links:
      - label: Proceedings
        url: "https://www.sandia.gov/app/uploads/sites/210/2025/12/CSRI-2025-proceedings_FINALDec1.pdf#page=296"
    with: Matthew Lowery and John D. Jakeman

ongoing:
  - title: Randomized greedy reduced bases
    body: >-
      Greedy reduced-basis methods build approximation spaces by successively selecting snapshots with
      large approximation error. Randomized selection can reduce the cost of this search, but imperfect
      choices accumulate and influence subsequent iterations. We are developing an analysis that uses
      conditional probability estimates to track these selection losses, with the aim of obtaining
      high-probability approximation bounds in terms of Kolmogorov widths.
    with: Amy De Castro, Filip Bělík, and Akil Narayan
