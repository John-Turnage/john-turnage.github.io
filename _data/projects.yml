# Home-page research section.
#   selected: featured projects, in display order; describe the construction and its guarantees.
#   related:  compact descriptions, paper links, and collaborators.
#   ongoing:  short notes on work in progress.
# body, with, and captions: Markdown; $...$ renders as math. figures: list of {src, alt, caption};
# with two or more, previous/next controls appear and the first is shown by default.

selected:
  - id: owls
    title: Operator learning with optimal sampling
    meta: Operator learning · Approximation theory
    body: >-
      We approximate operators between function spaces by Christoffel-weighted least squares in explicitly
      constructed finite-dimensional operator spaces. We develop linear and polynomial operator families,
      prove density results under assumptions on the input measure, and give implementable procedures for
      sampling function-valued inputs from the associated Christoffel measures. Our finite-sample analysis
      gives stability and accuracy bounds that distinguish best-approximation error from the effects of
      sampling, solver error, and output discretization. For suitable product spaces and full-field
      observations, the sample count sufficient for stability is independent of output resolution.
    links:
      - label: Preprint
        url: https://arxiv.org/abs/2512.11168
    with: Matthew Lowery, John D. Jakeman, Zachary Morrow, Akil Narayan, and Varun Shankar
    figures:
      - src: /assets/img/research/owls-schematic.png
        alt: Schematic of the least-squares problem relating sampled inputs, noisy outputs, and the approximation space of operators.
        caption: >-
          Function-valued inputs are sampled to stabilize recovery in the operator space $V$.
          The diagram separates the error of the best approximation in $V$ from the error in fitting it.
      # - src: /assets/img/research/owls-poisson.png
      #   alt: "Four panels: a random forcing, the true Poisson solution, the learned approximation, and their pointwise error."
      #   caption: >-
      #     Poisson equation on a median-error test input: forcing, true and learned solutions, and their
      #     pointwise difference, which stays below $10^{-5}$.
      # - src: /assets/img/research/owls-burgers.png
      #   alt: Three panels comparing true and approximate Burgers solutions, and a histogram of test errors.
      #   caption: >-
      #     Viscous Burgers' equation: true and learned solutions for the worst, median, and best test
      #     inputs, and the error distribution over 1000 tests.
      # - src: /assets/img/research/owls-navier-stokes.png
      #   alt: True vorticity, approximate vorticity, and their difference for a Navier–Stokes test sample.
      #   caption: >-
      #     Navier–Stokes: true and learned vorticity on a median-error test input, and their difference.

  - id: residual
    title: Uncertainty quantification for operator learning
    meta: Uncertainty quantification · Gaussian measures
    body: >-
      Building directly on this operator least-squares approximation, we place a Gaussian measure on a
      space of residual operators orthogonal to the fitted space. We condition this measure on an
      independent set of noisy full-field observations of the operator's function-valued outputs, after
      subtracting the first-stage fit. The resulting posterior provides a correction and uncertainty over
      the unresolved component. We prove finite-sample bounds on the posterior-averaged squared error of
      the complete approximation, with high probability over both datasets, accounting for fitting error
      and its propagation through conditioning.
    status: In preparation
    with: John D. Jakeman and Akil Narayan
    figures:
      - src: /assets/img/research/residual-two-stage.png
        alt: Schematic of the two-stage approximation, from sampled inputs through the approximation space to predicted outputs.
        caption: >-
          The two stages use independent inputs (filled and open points). Corrections lie in $V^\perp$,
          so they cannot remove the first-stage error $e_V$. Right: fitted output (dashed), corrected mean
          (solid), and posterior draws (grey) at one input.
      # - src: /assets/img/research/residual-function-spaces.png
      #   alt: Diagram of the function spaces and maps used for residual inference.
      #   caption: >-
      #     The prior is placed on continuous operators, where evaluation at an input $f$ is defined; it is
      #     not defined on general $L^2$ classes.

  - id: quadrature
    title: Constructive positive quadrature
    meta: Quadrature · Probability
    body: >-
      We analyze quadrature rules obtained by integrating weighted least-squares approximations built from
      random samples. A well-conditioned fit alone does not ensure positive quadrature weights. We establish
      finite-sample control of the scaled weights relative to their limiting values, allowing unbounded
      Christoffel functions and limiting weights approaching zero. Under suitable sampling and positivity
      assumptions, these estimates yield positive exact rules that can be pruned to at most $N$ nodes for
      an $N$-dimensional real space—a constructive generalized Tchakaloff result. Additional tail assumptions
      give weighted stability bounds for the unpruned rule.
    links:
      - label: Preprint
        url: https://arxiv.org/abs/2609.09506
    with: Filip Bělík and Akil Narayan
    figures:
      - src: /assets/img/research/quadrature-induced-rule.png
        alt: Quadrature weights from induced sampling clustering around their limiting curve, with the pruned positive rule marked in red.
        caption: >-
          Pruning reduces a positive 500-node rule to ten nodes while preserving exactness on the
          approximation space. The original weights (blue) are scaled by 500; the pruned weights
          (red), by ten. Green shows the limiting scaled weights before pruning.
      # - src: /assets/img/research/quadrature-densities.png
      #   alt: Sampling densities compared with the standard Gaussian density.
      #   caption: >-
      #     Sampling densities for $N = 5$: the standard Gaussian, the induced density, which concentrates
      #     samples near the basis singularities, and two mixtures.
      # - src: /assets/img/research/quadrature-basis.png
      #   alt: An orthonormal basis plotted in grey with a Riesz representer in red.
      #   caption: >-
      #     The test problem: the basis is singular at $x = -1, 0, 1$, so the Christoffel function is
      #     unbounded, and the representer of the integration functional (red) vanishes at $x = \pm\tfrac12$.

related:
  - id: kno
    title: Kernel neural operators
    body: >-
      We develop neural operators with independently chosen kernels and quadrature, allowing
      nonstationary, anisotropic kernels and irregular domains. We establish continuous and discrete
      universal approximation results and obtain comparable benchmark accuracy to Fourier and transformer
      neural operators, typically with an order of magnitude fewer trainable parameters.
    links:
      - label: TMLR
        url: https://openreview.net/forum?id=Q0C4jYZQ7x
      - label: arXiv
        url: https://arxiv.org/abs/2407.00809
    with: Matthew Lowery (lead author), Zachary Morrow, John D. Jakeman, Akil Narayan, Shandian Zhe, and Varun Shankar

  - id: generative
    title: Direct inference for quantities of interest
    body: >-
      We compare learning the conditional distribution of a low-dimensional quantity of interest directly
      with learning and pushing forward the parameter posterior. Across generative model classes on a
      linear–Gaussian benchmark, direct learning reduces model size and measured training cost, with
      broadly comparable accuracy.
    links:
      - label: Proceedings
        url: "https://www.sandia.gov/app/uploads/sites/210/2025/12/CSRI-2025-proceedings_FINALDec1.pdf#page=296"
    with: Matthew Lowery and John D. Jakeman

ongoing:
  - title: Randomized greedy reduced bases
    body: >-
      We are developing error bounds for randomized greedy reduced-basis methods. Conditional lower-tail
      estimates control the accumulated effect of imperfect snapshot selections, giving high-probability
      bounds in terms of Kolmogorov widths at a prescribed iteration. Selections may depend on previous
      iterations.
    with: Amy De Castro, Filip Bělík, and Akil Narayan
