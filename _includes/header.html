<header class="site-header">
  <div class="site-header__inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Primary">
      {%- for item in site.nav %}
        {%- assign is_current = false %}
        {%- if page.url == item.url %}{% assign is_current = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch color theme">
      <svg class="icon" aria-hidden="true"><use href="#icon-theme"></use></svg>
    </button>
  </div>
</header>
